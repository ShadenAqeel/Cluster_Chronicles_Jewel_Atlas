<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06080f">
<title>Cluster Chronicles · حكايات العناقيد</title>
<style>
:root{
  --bg:#06080f;--bg2:#0b1020;--panel:#10172a;--panel2:#161f38;
  --line:rgba(255,255,255,.10);--line2:rgba(255,255,255,.20);
  --ink:#f1f3fa;--sub:#a9b3ca;--mute:#8590ab;
  --gold:#e8b765;--gold2:#f8dca0;
  --k:#f2b24c;--d:#34d1b6;--p:#a58bff;--bad:#ff5d7a;--ok:#4fe3b0;
  --accent:var(--gold);
  --font:"Segoe UI",Tahoma,"Noto Sans Arabic","Noto Naskh Arabic",system-ui,-apple-system,Arial,sans-serif;
  --serif:Georgia,"Times New Roman","Noto Naskh Arabic",serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:
    radial-gradient(900px 520px at 8% -8%,rgba(94,64,190,.34),transparent 62%),
    radial-gradient(800px 520px at 100% 108%,rgba(20,150,150,.22),transparent 60%),
    radial-gradient(700px 400px at 85% 0%,rgba(190,60,110,.14),transparent 60%),
    var(--bg);
  color:var(--ink);font:15px/1.6 var(--font);overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(248,220,160,.55) .8px,transparent 1.1px),radial-gradient(rgba(150,230,255,.4) .7px,transparent 1px);
  background-size:83px 83px,131px 131px;background-position:0 0,41px 57px;animation:twinkle 7s ease-in-out infinite alternate}
@keyframes twinkle{to{opacity:.18}}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}
button:disabled{opacity:.45;cursor:default}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(100%)}
#app{position:relative;z-index:1;max-width:1600px;margin:auto;padding:18px 22px 36px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:14px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:13px}
.mark{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#2a2160,#0f1a33);border:1px solid rgba(232,183,101,.5);box-shadow:0 0 28px rgba(165,139,255,.35),inset 0 1px 0 rgba(255,255,255,.2)}
.mark svg{width:26px;height:26px;animation:spin3d 6s ease-in-out infinite}
@keyframes spin3d{0%,100%{transform:rotate(-6deg) scale(1)}50%{transform:rotate(6deg) scale(1.08)}}
.brand b{display:block;font:800 20px/1.2 var(--serif);color:var(--gold2);letter-spacing:.02em}
.brand small{display:block;color:var(--sub);font-size:12px;margin-top:2px}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line2);background:rgba(255,255,255,.06);color:var(--ink);border-radius:11px;padding:8px 14px;font-size:13px;font-weight:700;transition:.2s}
.btn:hover:not(:disabled){border-color:var(--gold);background:rgba(232,183,101,.14);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(120deg,#f8dca0,#e8b765 55%,#d9863f);color:#1b1206;border-color:#fbe6b5;box-shadow:0 8px 28px rgba(232,183,101,.32);font-weight:800;font-size:15px;padding:11px 26px;position:relative;overflow:hidden}
.btn.primary:hover:not(:disabled){box-shadow:0 12px 34px rgba(232,183,101,.5);transform:translateY(-2px);background:linear-gradient(120deg,#fff0c8,#f1c377 55%,#e59a52)}
.btn.primary:disabled{filter:saturate(.3) brightness(.7)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:11px;overflow:hidden;background:rgba(255,255,255,.05)}
.seg button{border:0;background:transparent;padding:8px 15px;font-size:13px;font-weight:800;color:var(--sub);transition:.2s}
.seg button[aria-pressed=true]{background:linear-gradient(120deg,#f8dca0,#e8b765);color:#1b1206}
.seg button:hover:not([aria-pressed=true]){color:#fff;background:rgba(255,255,255,.08)}

/* layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px;align-items:start}
.stagecol{min-width:0;border-radius:20px;overflow:hidden;border:1px solid var(--line2);background:var(--panel);box-shadow:0 0 0 1px #000,0 0 80px rgba(123,77,255,.28),0 30px 80px rgba(0,0,0,.65)}
.screen{position:relative;aspect-ratio:1200/680;background:#04060c;overflow:hidden;direction:inherit}
canvas#game{display:block;width:100%;height:100%;touch-action:none}
.vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 120px rgba(2,3,10,.85);background:linear-gradient(180deg,rgba(3,5,12,.35),transparent 18%,transparent 80%,rgba(3,5,12,.45))}
.pill{position:absolute;z-index:3;pointer-events:none;background:rgba(7,10,20,.74);border:1px solid var(--line2);color:var(--ink);backdrop-filter:blur(8px);border-radius:999px;font-size:12px;font-weight:700;padding:6px 14px}
#chapterPill{top:14px;inset-inline-start:16px;letter-spacing:.02em}
#chapterPill::before{content:"◆";color:var(--gold);margin-inline-end:8px;font-size:10px}
#locationPill{top:14px;inset-inline-end:16px;color:var(--gold2)}
#hintPill{bottom:14px;inset-inline-start:16px;max-width:76%;border-radius:12px;font-weight:600;line-height:1.55;padding:7px 14px;font-size:12.5px}
#hintPill strong{color:var(--gold2)}
.toast{position:absolute;z-index:20;left:50%;top:13%;transform:translate(-50%,-10px);max-width:min(660px,86%);background:rgba(9,13,26,.95);border:1px solid var(--gold);color:var(--ink);padding:11px 20px;border-radius:14px;font-size:14px;line-height:1.7;text-align:center;box-shadow:0 16px 50px rgba(0,0,0,.7),0 0 30px rgba(232,183,101,.18);opacity:0;pointer-events:none;transition:.25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{border-color:var(--bad);box-shadow:0 16px 50px rgba(0,0,0,.7),0 0 30px rgba(255,93,122,.22)}
.reveal{position:absolute;z-index:9;pointer-events:none;top:20%;left:50%;transform:translate(-50%,0);text-align:center;min-width:min(520px,78%);padding:22px 28px;border-block:1px solid rgba(232,183,101,.55);background:linear-gradient(90deg,transparent,rgba(6,9,18,.92) 20%,rgba(6,9,18,.92) 80%,transparent);opacity:0;visibility:hidden}
.reveal.on{visibility:visible;animation:revealIn 2.4s ease both}
.reveal small{display:block;font-size:12px;letter-spacing:.28em;color:var(--gold);font-weight:800;margin-bottom:8px}
.reveal b{display:block;font:800 clamp(22px,3.2vw,40px)/1.2 var(--serif);color:#fff;text-shadow:0 0 28px rgba(232,183,101,.55)}
@keyframes revealIn{0%{opacity:0;transform:translate(-50%,-18px)}18%,70%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,8px)}}

/* overlays */
.overlay{position:absolute;inset:0;z-index:30;display:flex;padding:18px;background:radial-gradient(ellipse at 50% 30%,rgba(6,8,18,.55),rgba(3,4,10,.9));backdrop-filter:blur(3px);overflow:auto}
.card{position:relative;margin:auto;width:min(900px,100%);border-radius:22px;border:1px solid var(--line2);background:linear-gradient(160deg,rgba(28,22,72,.97),rgba(10,15,32,.97));box-shadow:0 30px 90px rgba(0,0,0,.8),0 0 70px rgba(123,77,255,.22);padding:26px 30px;text-align:center;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 0 auto;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.kicker{color:var(--gold);font-weight:800;font-size:12px;letter-spacing:.2em;text-transform:uppercase}
html[dir=rtl] .kicker{letter-spacing:.04em;font-size:13px}
.title{font:800 clamp(30px,4.4vw,58px)/1.12 var(--serif);margin:8px 0 6px;color:#fff6df;text-shadow:0 8px 40px rgba(232,183,101,.35)}
.title em{font-style:normal;background:linear-gradient(90deg,#ff7aa8,#f8dca0,#6fe8cf,#b9a4ff,#ff7aa8);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 7s linear infinite}
@keyframes shim{to{background-position:300% 0}}
.lead{color:var(--sub);max-width:640px;margin:6px auto 16px;font-size:14px;line-height:1.85}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}
.choice{margin:0 auto 14px;max-width:560px;display:grid;gap:10px}
.choice label{color:var(--gold2);font-size:12px;font-weight:800;letter-spacing:.04em}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick button{display:flex;align-items:center;gap:12px;border:1px solid var(--line2);background:rgba(255,255,255,.05);border-radius:14px;padding:8px 14px;color:var(--ink);font-weight:800;font-size:14px;transition:.2s;text-align:start}
.pick button canvas{width:52px;height:52px;flex:none;border-radius:10px;background:rgba(0,0,0,.35)}
.pick button:hover{border-color:var(--gold);background:rgba(232,183,101,.1);transform:translateY(-2px)}
.pick button[aria-pressed=true]{border-color:var(--gold2);background:linear-gradient(135deg,rgba(232,183,101,.26),rgba(165,139,255,.2));box-shadow:0 0 26px rgba(232,183,101,.3)}
.cast{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 auto 16px;max-width:660px}
.cast div{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:14px;padding:8px 12px;text-align:start}
.cast canvas{width:46px;height:46px;flex:none;border-radius:10px;background:rgba(0,0,0,.35)}
.cast b{display:block;font-size:13px;color:#fff;letter-spacing:.04em}
.cast small{display:block;color:var(--sub);font-size:11.5px;line-height:1.4}
.foot{color:var(--mute);font-size:11.5px;margin-top:12px;line-height:1.8}

/* dialogue */
.dialogue{position:absolute;z-index:25;inset-inline:16px;bottom:14px;display:flex;gap:16px;align-items:stretch;padding:14px 16px;border-radius:18px;background:linear-gradient(120deg,rgba(14,18,40,.97),rgba(24,22,60,.97));border:1px solid var(--line2);border-top:2px solid var(--accent);box-shadow:0 20px 70px rgba(0,0,0,.8),0 0 40px rgba(123,77,255,.2)}
.portrait{width:92px;height:92px;flex:none;border-radius:14px;border:1px solid var(--line2);background:radial-gradient(circle at 50% 25%,rgba(255,255,255,.1),rgba(0,0,0,.4))}
.dbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.speaker{font-weight:800;font-size:13px;letter-spacing:.06em;color:var(--accent)}
.line{font-size:16px;line-height:1.85;color:var(--ink);min-height:58px}
.dnav{display:flex;gap:8px;justify-content:flex-end;margin-top:auto}
html[dir=rtl] .dnav{justify-content:flex-start}
.small{border:1px solid var(--line2);background:rgba(255,255,255,.06);border-radius:9px;padding:6px 14px;font-size:12.5px;font-weight:800}
.small:hover{border-color:var(--gold);background:rgba(232,183,101,.15)}
.small.go{background:linear-gradient(120deg,#f8dca0,#e8b765);color:#1b1206;border-color:#fbe6b5}

/* quiz + evidence + ending */
.qcard{width:min(620px,100%)}
.qcard h3{margin:4px 0 6px;font:800 24px/1.3 var(--serif);color:#fff6df}
.qcard p{margin:0 0 10px;color:var(--ink);font-size:14.5px;line-height:1.85}
.radar{position:relative;height:150px;margin:6px auto 12px;max-width:420px}
.radar .ring{position:absolute;inset:6px 50px;border-radius:50%;border:2px dashed rgba(52,209,182,.7);background:radial-gradient(circle,rgba(52,209,182,.16),transparent 70%);animation:ringPulse 2.2s ease-in-out infinite}
@keyframes ringPulse{50%{transform:scale(1.06);border-color:rgba(124,255,230,.95)}}
.radar .dot{position:absolute;border-radius:50%;background:#7dffe6;box-shadow:0 0 8px #34d1b6;transform:translate(-50%,-50%)}
.radar .dot.me{background:#fff;width:9px!important;height:9px!important;box-shadow:0 0 14px #fff}
.eps{display:flex;gap:22px;justify-content:center;height:100%;align-items:center}
.eps span{min-width:120px;border:1px solid rgba(52,209,182,.6);background:rgba(52,209,182,.1);padding:12px 8px;border-radius:14px;font-size:22px;font-weight:900;color:#c8fff4}
.eps b{display:block;font-size:12px;margin-top:4px;color:var(--gold2)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.opt{border:1px solid var(--line2);background:rgba(255,255,255,.06);border-radius:13px;padding:13px 10px;font-weight:800;font-size:15px;color:#fff;transition:.2s}
.opt:hover{border-color:var(--gold);background:linear-gradient(135deg,rgba(232,183,101,.24),rgba(165,139,255,.22));transform:translateY(-2px)}
.note{margin-top:10px;font-size:12px;color:var(--sub);line-height:1.7}
.metrics,.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.metrics>div,.stats>div,.tcards>div,.chart{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:13px;padding:10px 12px}
.metrics b,.stats b{display:block;font-size:24px;color:var(--gold2);font-family:var(--serif)}
.metrics small,.stats small{color:var(--sub);font-size:12px}
.graphs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.chart h3{margin:0 0 6px;font-size:14px;color:#fff}
.chart p{margin:6px 0 0;font-size:12.5px;color:var(--sub);line-height:1.7}
.chart p b{color:var(--gold2)}
.histo{height:96px;display:flex;align-items:flex-end;gap:7px;padding:4px 2px 0;border-bottom:1px solid var(--line2)}
.bar-slot{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar{width:100%;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--gold2),#b5662d);min-height:3px;transform-origin:bottom;animation:grow .8s ease both}
@keyframes grow{from{transform:scaleY(0)}}
.bar-label{font-size:10px;color:var(--sub);margin-top:4px;white-space:nowrap}
.insight{border:1px solid rgba(232,183,101,.4);background:rgba(232,183,101,.08);border-radius:13px;padding:10px 14px;margin-bottom:14px;font-size:13.5px;line-height:1.8;text-align:start}
.truth{border:1px solid rgba(255,93,122,.4);background:rgba(255,93,122,.08);border-radius:14px;padding:12px 16px;margin:10px 0;text-align:start}
.truth b{display:block;color:#ffc2cf;margin-bottom:4px;font-size:15px}
.truth span{color:var(--ink);font-size:13.5px;line-height:1.8}
.tcards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0;text-align:start}
.tcards b{display:block;color:var(--gold2);font-size:14px;margin-bottom:3px}
.tcards small{color:var(--sub);font-size:12px;line-height:1.7}
.tiny{font-size:11.5px;color:var(--mute);line-height:1.8}
.quote{margin:10px 0 14px;font:italic 15px/1.8 var(--serif);color:var(--gold2)}
.crown{font-size:42px;color:var(--gold2);filter:drop-shadow(0 0 22px rgba(232,183,101,.8));animation:spin3d 4s ease-in-out infinite;display:inline-block}

/* below-canvas bars */
.abilities{display:none;gap:10px;justify-content:center;padding:10px;background:linear-gradient(100deg,#0f1630,#14243d);border-top:1px solid var(--line2)}
.abilities.visible{display:flex}
.skill{flex:1;max-width:240px;border:1px solid var(--line2);border-inline-start:4px solid var(--c);background:rgba(255,255,255,.06);border-radius:12px;padding:7px 12px;font-weight:800;font-size:13px;text-align:start;transition:.2s}
.skill small{display:block;color:var(--sub);font-weight:600;font-size:11.5px}
.skill:hover{background:rgba(255,255,255,.12);transform:translateY(-2px)}
.skill kbd{display:inline-block;min-width:20px;text-align:center;background:var(--c);color:#10121c;border-radius:5px;padding:0 5px;margin-inline-end:6px;font:800 12px var(--font)}
.statbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:11px 20px;background:linear-gradient(100deg,#141a38,#101a2e 60%,#0d2a3a);border-top:1px solid var(--line2);font-weight:700;font-size:14px}
.statbar>span:last-child{text-align:end}
.hearts{letter-spacing:3px;color:var(--bad);filter:drop-shadow(0 0 8px rgba(255,93,122,.5));font-size:16px}
.hearts i{font-style:normal;color:rgba(255,255,255,.2)}
.score{color:var(--gold2);font-family:var(--serif);font-size:18px;text-shadow:0 0 14px rgba(232,183,101,.5);display:inline-block}
.score.pop{animation:pop .45s ease}
@keyframes pop{45%{transform:scale(1.25);filter:brightness(1.5)}}
.touch{display:none}

/* side panel */
.side{display:grid;gap:16px;padding:20px;border-radius:20px;border:1px solid var(--line2);background:linear-gradient(165deg,rgba(26,20,66,.95),rgba(11,16,32,.96));box-shadow:0 0 50px rgba(123,77,255,.18)}
.eyebrow{color:var(--gold);font-weight:800;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase}
html[dir=rtl] .eyebrow{letter-spacing:.03em;font-size:12.5px}
.side h2{margin:4px 0 6px;font:800 23px/1.3 var(--serif);color:#fff6df}
.side p{margin:0;color:var(--sub);font-size:13.5px;line-height:1.85}
.steps{display:flex;gap:6px;margin:12px 0}
.steps span{flex:1;height:6px;border-radius:4px;background:rgba(255,255,255,.14)}
.steps .now{background:var(--gold);box-shadow:0 0 14px var(--gold)}
.steps .done{background:var(--ok)}
.guide{display:grid;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.guide>div{padding:9px 13px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.035)}
.guide>div:last-child{border:0;background:rgba(232,183,101,.1)}
.guide span{display:block;font-size:11px;font-weight:800;color:var(--gold);letter-spacing:.08em;text-transform:uppercase}
html[dir=rtl] .guide span{letter-spacing:.02em;font-size:12px}
.guide p{color:var(--ink);font-size:13px;line-height:1.75}
.rule{height:1px;background:linear-gradient(90deg,transparent,rgba(232,183,101,.5),transparent)}
.comp{display:flex;align-items:center;gap:11px;padding:7px 10px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.03);opacity:.5;transition:.35s;margin-top:8px}
.comp canvas{width:44px;height:44px;border-radius:9px;background:rgba(0,0,0,.4);filter:grayscale(.8)}
.comp b{display:block;font-size:13px;color:#fff;letter-spacing:.04em}
.comp small{color:var(--sub);font-size:11.5px;line-height:1.4;display:block}
.comp.joined{opacity:1;border-color:var(--c);background:rgba(255,255,255,.07);box-shadow:0 0 22px color-mix(in srgb,var(--c) 30%,transparent)}
.comp.joined canvas{filter:none}
.insightlog{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0 10px;color:var(--ink)!important}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.key{background:rgba(255,255,255,.08);border:1px solid var(--line2);border-radius:7px;padding:1px 9px;font-size:11.5px;font-weight:800;color:#fff}

@media(max-width:980px){
  .layout{grid-template-columns:minmax(0,1fr)}
  #app{padding:12px}
  .title{font-size:clamp(26px,7vw,44px)}
  .cast small{display:none}
  .tcards,.graphs,.metrics,.stats{grid-template-columns:1fr}
  .line{font-size:14px;min-height:44px}
  .portrait{width:64px;height:64px}
  .card{padding:18px 14px}
}
@media(pointer:coarse){
  .touch{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#0b1224;border-top:1px solid var(--line2);direction:ltr}
  .dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:6px}
  .dpad button,.tact button{border:1px solid var(--line2);background:rgba(255,255,255,.1);border-radius:14px;font-weight:800;color:#fff;touch-action:none;user-select:none}
  .dpad .up{grid-column:2}.dpad .left{grid-row:2}.dpad .down{grid-row:2;grid-column:2}.dpad .right{grid-row:2;grid-column:3}
  .tact{display:flex;gap:10px}.tact button{width:84px;height:52px}
}
@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}

#endOverlay .card{padding:16px 26px}
#endOverlay .title{font-size:clamp(26px,3.2vw,42px);margin:2px 0}
#endOverlay .lead{margin:2px auto 8px;font-size:13.5px;line-height:1.7}
#endOverlay .truth,#endOverlay .stats,#endOverlay .tcards{margin:6px 0}
#endOverlay .stats b{font-size:20px}
#endOverlay .quote{margin:6px 0 10px;font-size:14px}
#endOverlay .crown{font-size:28px;line-height:1}
#endOverlay .tiny{margin:4px 0}

</style>
</head>
<body>
<div id="app">

  kRound:0,kSuccess:0,dbRound:0,dbSuccess:0,pcaPicked:null,allies:{K:false,D:false,P:false},bossHP:3,bossStep:0,bossOrder:['K','D','P'],bossCooldown:0,shotTimer:1.4,pat:0,
  dialog:null,quiz:false,completed:false,evidenceOpen:false,combo:0,comboT:0,haz:makeHaz(0),insight:b('كل خطوة تكشف جزءًا من الحقيقة…','Every step reveals a piece of the truth…'),neigh:0};
 particles=[];keys={};projectiles=[];rings=[];pops=[];ghosts=[];fol=[];stopAmbience();
 $('evidenceOverlay').classList.add('hidden');$('quiz').classList.add('hidden');$('dialogue').classList.add('hidden');$('endOverlay').classList.add('hidden');$('startOverlay').classList.remove('hidden');
 setStartText();updateUI()}
function makeHaz(n){
 if(n===0)return[{type:'patrol',pts:[[170,430],[520,430],[520,520],[170,520]],i:1,sp:92,r:19,x:170,y:430,ph:0,hd:0},{type:'patrol',pts:[[650,420],[960,420],[960,520],[650,520]],i:1,sp:104,r:19,x:650,y:420,ph:2,hd:0}];
 if(n===1)return[{type:'sweep',pts:[[250,548],[950,548]],i:1,sp:140,r:19,x:250,y:548,ph:1,hd:0}];
 if(n===2)return[0,1,2].map(i=>{const a=rand(0,TAU);return{type:'wisp',x:330+i*270,y:380+i*60,vx:Math.cos(a)*100,vy:Math.sin(a)*80,r:12,ph:i}});
 return[]}
function setStartText(){const sb=$('startBtn');sb.disabled=!gender;sb.textContent=gender?L(G('▶ ابدأ المغامرة','▶ ابدئي المغامرة'),'▶ Begin the adventure'):L('▶ اختر شخصيتك للبدء','▶ Choose your Keeper to begin');
 $('introRole').textContent=gender?L(G('أنت حارس التاج الأخير. اجمع الأدلة واجتز اختبارات الحراس لتكشف سرّ الملك.','أنتِ حارسة التاج الأخيرة. اجمعي الأدلة واجتازي اختبارات الحراس لتكشفي سرّ الملك.'),'You are the last Keeper of the Crown. Gather the evidence, pass the Guardians’ trials and uncover the king’s secret.'):L('اجمع الأدلة، واجتز اختبارات الحراس، واكشف سرّ الملك.','Gather the evidence, pass the Guardians’ trials and uncover the king’s secret.')}
function chooseGender(x){gender=x;$('chooseHe').setAttribute('aria-pressed',x==='male');$('chooseShe').setAttribute('aria-pressed',x==='female');setStartText()}

/* ============ UI ============ */
function setInsight(ar,en){g.insight=b(ar,en);$('lastInsight').textContent=T(g.insight)}
function toast(s,bad=false){const el=$('toast');el.textContent=s;el.classList.toggle('bad',bad);el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),bad?5600:3200);$('ariaStatus').textContent=s}
function hintText(){
 const n=g.collected.size;
 if(g.stage===0)return n<6?b('المس كل بلّورة لالتقاطها · تجنّب الحرّاس الآليين','Touch each crystal to collect it · avoid the sentinels'):g.ready?b('البوابة الذهبية مفتوحة · اضغط E للدخول','The golden gate is open · press E to enter'):b('تحدّث مع K-Means (E) لفتح البوابة','Speak to K-Means (E) to open the gate');
 if(g.stage===1)return g.holding?b(`ألماسة ${g.holding.carat.toFixed(2)} قيراط · احملها إلى الخزنة الصغيرة يسارًا أو الكبيرة يمينًا (E)`,`${g.holding.carat.toFixed(2)} ct diamond · carry it to the small vault (left) or the large vault (right), then press E`):g.questComplete?b('اكتملت المحكمة · ادخل البوابة','The court is complete · enter the gate'):b('التقط الألماسة من المنصّة المركزية','Pick up the diamond from the central dais');
 if(g.stage===2)return g.questComplete?b('اكتمل تحدي DBSCAN · ادخل البوابة','DBSCAN’s trial is complete · enter the gate'):b('اذهب إلى الماسح المضيء واضغط E · الحلقة توضيحية','Reach the glowing scanner and press E · the ring is illustrative');
 if(g.stage===3)return g.questComplete?b('فتح المنشور الباب · ادخل البوابة','The prism has opened the door · enter the gate'):b('اختر أقل عدد من المكوّنات يحتفظ بـ 85% على الأقل (E)','Choose the fewest components keeping at least 85% variance (E)');
 const k=g.bossOrder[g.bossStep];return k?b(`${BPROMPT[k].ar} · القدرات 1 أو 2 أو 3 · تفادَ الشظايا`,`${BPROMPT[k].en} · abilities 1, 2 or 3 · dodge the shards`):b('الضربة الأخيرة!','The final blow!')}
function updateUI(){
 const s=STG[g.stage];
 $('chapterPill').textContent=T(s.pill);$('locationPill').textContent=T(s.loc);
 $('qTitleSide').textContent=T(s.title);$('qDescSide').textContent=T(s.desc);$('qWhy').textContent=T(s.why);$('qHow').textContent=T(s.how);$('qNext').textContent=T(s.next());
 $('lastInsight').textContent=T(g.insight);
 $('hearts').innerHTML='♥ '.repeat(Math.max(0,g.hp))+'<i>♥ </i>'.repeat(Math.max(0,5-g.hp));
 $('score').textContent=String(g.score).padStart(6,'0');
 let pr='';
 if(g.stage===0)pr=L(`${g.collected.size} / 6 بلّورات`,`${g.collected.size} / 6 crystals`);
 if(g.stage===1)pr=L(`${g.kRound} / 4 ألماسات`,`${g.kRound} / 4 diamonds`);
 if(g.stage===2)pr=L(`${g.dbRound} / 3 تحديات`,`${g.dbRound} / 3 trials`);
 if(g.stage===3)pr=L('المطلوب: 85% من التباين','Goal: 85% of variance');
 if(g.stage===4)pr=L(`${3-g.bossHP} / 3 دروع`,`${3-g.bossHP} / 3 shields`);
 $('taskCounter').textContent=pr;
 [...$('steps').children].forEach((v,i)=>v.className=i<g.stage?'done':i===g.stage?'now':'');
 $('evidenceBtn').disabled=g.collected.size<6;
 for(const k of['K','D','P'])$('ally'+k).classList.toggle('joined',g.allies[k]);
 $('abilities').classList.toggle('visible',g.stage===4&&!g.completed);
 const h=hintText();$('hintPill').innerHTML=`<strong>${L('مهمتك الآن','Objective')}</strong> · ${T(h)}`}
function announce(n){const el=$('reveal');$('revNo').textContent='✦  '+L(['الفصل الأول','الفصل الثاني','الفصل الثالث','الفصل الرابع','الفصل الأخير'][n],['CHAPTER I','CHAPTER II','CHAPTER III','CHAPTER IV','FINAL CHAPTER'][n])+'  ✦';$('revTitle').textContent=T(STG[n].title);
 el.classList.remove('on');void el.offsetWidth;el.classList.add('on');clearTimeout(chapTimer);chapTimer=setTimeout(()=>el.classList.remove('on'),2500)}
function refreshAudioUI(){$('musicBtn').textContent=musicOn?L('♪ الموسيقى: تشغيل','♪ Music: on'):L('♪ الموسيقى: إيقاف','♪ Music: off')}

/* dialogue */
function dialogue(lines,done=null){g.dialog={lines,i:0,done};$('dialogue').classList.remove('hidden');showDialog()}
function showDialog(instant=false){
 const d=g.dialog;if(!d)return;const a=d.lines[d.i],w=a.who,pn=PN[w]||PN.N;
 d.full=T({ar:a.ar,en:a.en});d.n=instant?d.full.length:0;d.typing=!instant;
 $('dialogue').style.setProperty('--accent',pn.c);
 $('dSpeaker').textContent=w==='H'?playerLabel():T(pn);$('dLine').textContent=instant?d.full:'';
 drawPortrait($('portrait'),w,gender==='female');
 $('dNext').textContent=d.i===d.lines.length-1?L('هيا ✓','Let’s go ✓'):L('التالي ↵','Next ↵')}
function nextDialogue(skip=false){const d=g.dialog;if(!d)return;
 if(!skip&&d.typing){d.typing=false;d.n=d.full.length;$('dLine').textContent=d.full;return}
 if(skip)d.i=d.lines.length-1;else d.i++;
 if(d.i>=d.lines.length){g.dialog=null;$('dialogue').classList.add('hidden');d.done&&d.done();updateUI()}else showDialog()}

/* fx helpers */
function burst(x,y,c,n=16){for(let i=0;i<n;i++){const a=rand(0,TAU),v=rand(40,190);particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(.45,1.1),ttl:1.1,c,size:rand(1.6,4.2)})}rings.push({x,y,c,t:0})}
function givePoints(n,x,y,extra=''){g.score+=n;updateUI();const s=$('score');s.classList.remove('pop');void s.offsetWidth;s.classList.add('pop');pops.push({x:x??g.player.x,y:(y??g.player.y)-110,t:0,s:'+'+n+extra})}
function loseHeart(){if(g.hp<=0)return;g.hp--;snd('hurt');flash=.4;shake=.4;burst(g.player.x,g.player.y-40,'#ff5d7a',16);updateUI();
 if(g.hp<=0)dialogue([{who:'P',ar:()=>`حتى حراس التاج يستحقون فرصة ثانية. استعدت طاقتك، ${G('حاول','حاولي')} من جديد!`,en:'Even the Keepers deserve a second chance. Your strength is restored — try again!'}],()=>{g.hp=5;projectiles=[];const p=g.player;p.x=140;p.y=560;p.vx=p.vy=0;p.inv=1.6;updateUI()})}

/* evidence */
const EDA={carat:{labels:['0.2–0.5','0.5–1','1–1.5','1.5–2','2+'],counts:[17670,17196,12806,4077,2144]},depth:{labels:['<60','60–62','62–64','64+'],counts:[5101,24140,22571,2081]}};
function renderEDAChart(id,data){const root=$(id);root.innerHTML='';const mx=Math.max(...data.counts);data.counts.forEach((v,i)=>{const s=document.createElement('div');s.className='bar-slot';const bar=document.createElement('div');bar.className='bar';bar.style.height=(v/mx*72)+'px';bar.title=`${data.labels[i]}: ${v.toLocaleString('en-US')} ${L('ألماسة','diamonds')}`;const lab=document.createElement('span');lab.className='bar-label';lab.textContent=data.labels[i];s.append(bar,lab);root.appendChild(s)})}
function renderEDA(){renderEDAChart('caratChart',EDA.carat);renderEDAChart('depthChart',EDA.depth)}
function showEvidence(){if(g.collected.size<6)return;g.evidenceOpen=true;keys={};renderEDA();$('evidenceOverlay').classList.remove('hidden')}
function closeEvidence(){g.evidenceOpen=false;$('evidenceOverlay').classList.add('hidden');setInsight('الأدلة: 53,893 سجلًا نظيفًا. ستة قياسات في التجميع، والسعر ليس بينها.','The evidence: 53,893 clean records. Six measurements feed the clustering — and price is not one of them.');updateUI();toast(L('✓ اكتمل سجل الأدلة. تحدّث مع K-Means لفتح المحكمة.','✓ Evidence reviewed. Speak to K-Means to open the court.'))}
function renderEnd(){$('endScore').textContent=g.score.toLocaleString('en-US');$('endingHero').textContent=L(`${playerLabel()} ${G('كشف','كشفت')} سرّ المملكة: لم تكن البلّورات مفقودة، بل كانت المعرفة مجزّأة بين الحراس.`,'The Keeper uncovered the kingdom’s secret: the crystals were never lost — the knowledge was simply divided among the Guardians.')}

/* ============ stage flow ============ */
function enterStage(n){
 const p=g.player;g.stage=n;announce(n);const sp=[[110,590],[130,590],[110,590],[110,590],[140,580]][n];p.x=sp[0];p.y=sp[1];p.vx=p.vy=0;p.inv=1.5;
 g.questComplete=false;g.ready=false;g.holding=null;projectiles=[];particles=[];ghosts=[];fol=[];g.haz=makeHaz(n);fade=1;snd('portal');
 if(n===1){g.kRound=0;g.kSuccess=0;const sh=a=>a.sort(()=>Math.random()-.5);g.kCases=sh([...sh(DATA.cases.filter(d=>d.class===0)).slice(0,2),...sh(DATA.cases.filter(d=>d.class===1)).slice(0,2)])}
 if(n===2){g.dbRound=0;g.dbSuccess=0}
 if(n===3)g.pcaPicked=null;
 if(n===4){g.bossHP=3;g.bossStep=0;g.shotTimer=2;g.bossCooldown=0;g.pat=0;g.bossOrder=['K','D','P'].sort(()=>Math.random()-.5)}
 updateUI();burst(p.x,p.y-30,'#c9b5ff',34);
 const hh=(m,f)=>G(m,f);
 if(n===1)dialogue([
  {who:'N',ar:'المحكمة الأولى: لإعادة بناء التاج، علينا معرفة كيف تنتظم الألماسات المتشابهة.',en:'The first trial: to rebuild the crown, we must learn how similar diamonds organise themselves.'},
  {who:'K',ar:'أنا أؤمن بالنظام! اخترت مركزين، وأخصّص لكل ألماسة أقرب مجموعة وفق القياسات الست بعد التقييس (Scaling).',en:'I believe in order! I chose two centres and assign every diamond to the nearest group, using all six measurements after scaling.'},
  {who:'D',ar:'لكن هل يستطيع نظامك تمييز الأحجار التي لا تشبه أي تجمّع كثيف؟',en:'But can your system recognise the stones that resemble no dense group at all?'},
  {who:'K',ar:()=>`${hh('اختبر','اختبري')} حكمي: ${hh('احمل','احملي')} أربعة أحجار من المنصّة الوسطى، و${hh('ضعها','ضعيها')} في الخزنة المناسبة. وانتبه للحارس الآلي!`.replace('وانتبه',hh('وانتبه','وانتبهي')),en:'Test my judgement: carry four stones from the central dais to the right vault. And watch the sentinel!'}]);
 if(n===2)dialogue([
  {who:'N',ar:'في الكهف السحيق نقاط لم يهتمّ بها أحد؛ هنا تبدأ حكاية الألماسات المنسيّة.',en:'Deep in the cavern wait observations that no one ever noticed. Here begins the tale of the forgotten diamonds.'},
  {who:'D',ar:'لا أجبر كل نقطة على الانضمام. أبحث عمّن يملك جيرانًا كفاية داخل نصف القطر eps.',en:'I never force a point to join. I look for those with enough neighbours inside the radius eps.'},
  {who:'K',ar:'ربما لم تكن خريطتي كاملة كما ظننت…',en:'Perhaps my map was not as complete as I thought…'},
  {who:'D',ar:()=>`${hh('افحص','افحصي')} ثلاث حالات لتفهم كيف نكتشف الكثافة والضوضاء. وتجنّب الأرواح الحمراء، فهي النقاط الشاذة.`.replace('وتجنّب',hh('وتجنّب','وتجنّبي')),en:'Complete three cases to learn how density and noise are detected. And avoid the red wisps — they are the outliers.'}]);
 if(n===3)dialogue([
  {who:'N',ar:'كلما ازدادت القياسات، ازداد تعقيد خريطة المملكة. في مرصد المنشور تظهر طريقة جديدة للرؤية.',en:'The more measurements we take, the more tangled the kingdom’s map becomes. In the Prism Observatory a new way of seeing appears.'},
  {who:'P',ar:'أنا لست خوارزمية تجميع. أعيد تمثيل القياسات بمحاور تلخّص اتجاهات التباين الأكبر.',en:'I am not a clustering algorithm. I re-express the measurements along axes that capture the largest directions of variance.'},
  {who:'P',ar:()=>`${hh('اختر','اختاري')} أقل عدد من المكوّنات الجديدة يحفظ 85% من التباين على الأقل.`,en:'Choose the fewest new components that keep at least 85% of the variance.'}]);
 if(n===4)dialogue([
  {who:'N',ar:'وصلت إلى عرش الملك. كان يظن أن كل الألماس يجب أن يُفهم بطريقته وحدها، فتصدّع التاج حين عجز عن تفسير الاختلاف.',en:'You have reached the king’s throne. He believed every diamond must be understood by his method alone — and the crown cracked when it could not explain difference.'},
  {who:'B',ar:'لا حقيقة إلا حقيقتي! لن أسمح لهذه الطرق المختلفة بإعادة تاجي!',en:'There is no truth but mine! I will not let these different methods restore my crown!'},
  {who:'P',ar:()=>`${hh('استخدم','استخدمي')} القدرات الثلاث: 1 للتجميع، 2 للكثافة، 3 لاختصار الأبعاد، بحسب ما يطلبه الملك. و${hh('تفادَ','تفادي')} الشظايا!`,en:'Use the three abilities — 1 for grouping, 2 for density, 3 for dimension reduction — according to what the king demands. And dodge the shards!'}])}
function startGame(){
 if(!gender){toast(L('اختر البطل أو البطلة أولًا.','Choose your Keeper first.'),true);return}
 audioReady();startAmbience();g.started=true;$('startOverlay').classList.add('hidden');announce(0);updateUI();
 dialogue([
  {who:'N',ar:'منذ زمن بعيد، كان تاج مملكة الألماس يكشف الأنماط الخفيّة بين أحجارها… حتى تحطّم وتفرّقت بلّوراته الست.',en:'Long ago, the crown of the Diamond Kingdom revealed the hidden patterns between its stones… until it shattered and its six crystals were scattered.'},
  {who:'N',ar:()=>`${G('أنت حارس التاج الأخير','أنتِ حارسة التاج الأخيرة')}. إن ${G('استعدتَ','استعدتِ')} البلّورات و${G('اجتزتَ','اجتزتِ')} اختبارات الحراس الثلاثة، فقد ${G('تكشف','تكشفين')} سرّ الملك المتصدّع.`,en:'You are the last Keeper of the Crown. Recover the crystals and pass the trials of the three Guardians, and you may uncover the secret of the Fractured King.'},
  {who:'K',ar:'أنا أريد نظامًا واضحًا: مجموعتان، ولكل ألماسة أقرب مركز.',en:'I want clear order: two groups, and every diamond belongs to its nearest centre.'},
  {who:'D',ar:'وأنا أسأل: ماذا عن النقاط التي لا تنتمي إلى منطقة كثيفة؟',en:'And I ask: what about the points that belong to no dense region at all?'},
  {who:'P',ar:()=>`لدينا منظور ثالث. لكن أولًا، ${G('اجمع','اجمعي')} البلّورات الست المتناثرة في الخزنة، و${G('تجنّب','تجنّبي')} الحرّاس الآليين. ثم ${G('عد','عودي')} إلى K-Means.`,en:'There is a third way of seeing. But first, gather the six scattered crystals in the vault — and beware the sentinels. Then return to K-Means.'}])}

function pickFeature(f){
 g.collected.add(f.id);g.combo=g.comboT>0?g.combo+1:1;g.comboT=6;const pts=90*Math.min(g.combo,4);givePoints(pts,f.x,f.y-30,g.combo>1?` ×${Math.min(g.combo,4)}`:'');
 burst(f.x,f.y-34,f.col,28);snd('ping');toast(`✧ ${L('بلّورة','Crystal')} ${T(f.full)} · ${g.collected.size}/6`);updateUI();
 if(g.collected.size===6){setInsight('استعدت البلّورات الست؛ الآن تستطيع رؤية الأدلة قبل أول محكمة.','Six crystals recovered — you can now study the evidence before the first trial.');
  dialogue([{who:'P',ar:()=>`أحسنت! ${G('جمعتَ','جمعتِ')} البلّورات الست. ${G('افتح','افتحي')} سجل الأدلة لتبدأ المحاكمة.`,en:'Well done! All six crystals are yours. Open the evidence ledger before the trial begins.'}],()=>showEvidence())}}
function pickDiamond(){g.holding=g.kCases[g.kRound];snd('ping');burst(600,405,'#f8dca0',26);const d=g.holding;
 toast(L(`تم فحص الحجر: ${d.carat.toFixed(2)} قيراط · طول ${d.x.toFixed(2)} · عرض ${d.y.toFixed(2)} · عمق ${d.depth.toFixed(1)}%`,`Stone inspected: ${d.carat.toFixed(2)} ct · length ${d.x.toFixed(2)} · width ${d.y.toFixed(2)} · depth ${d.depth.toFixed(1)}%`));updateUI()}
function deposit(type){
 if(!g.holding)return;const d=g.holding,ok=d.class===type,vx=type===0?215:985;
 if(ok){g.kRound++;g.kSuccess++;givePoints(220,vx,380);snd('win');burst(vx,330,type===0?'#34d1b6':'#f2b24c',34);toast(L('✓ صحيح: قياسات الحجر أقرب لهذه المجموعة. K-Means ينظر إلى القياسات الست بعد التقييس.','✓ Correct: the stone’s measurements sit closer to this group. K-Means looks at all six scaled measurements.'));g.holding=null;updateUI()}
 else{const big=d.class===1;
  loseHeart();setInsight(`تلميح المحاكمة: هذا الحجر يتبع مجموعة الألماس ${big?'الأكبر':'الأصغر'} بحسب K-Means.`,`Trial hint: K-Means places this stone in the ${big?'larger':'smaller'} diamond group.`);
  toast(L(`✕ هذا الحجر يتبع مجموعة الألماس ${big?'الأكبر':'الأصغر'} بحسب K-Means. القيراط مؤشر، لكن القرار يعتمد على 6 قياسات بعد التقييس. جرّب الخزنة الأخرى؛ الحجر لا يزال معك.`,`✕ K-Means places this stone in the ${big?'larger':'smaller'} group. Carat is a hint, but the decision uses six scaled measurements. Try the other vault — you still hold the stone.`),true);updateUI();return}
 if(g.kRound>=4){g.questComplete=true;g.allies.K=true;givePoints(450);
  setInsight('K-Means وجد مجموعتين: أحجار أصغر وأحجار أكبر. لم يدخل السعر في التجميع.','K-Means found two groups: smaller stones and larger stones. Price never entered the clustering.');updateUI();
  dialogue([
   {who:'K',ar:`نجحت في ${g.kSuccess}/4. عملي لا يعتمد على القيراط وحده؛ استخدمت القياسات الست بعد StandardScaler.`,en:`You got ${g.kSuccess}/4. I never rely on carat alone — I used all six measurements after StandardScaler.`},
   {who:'D',ar:'الآن عرفت كيف ننظّم الأحجار. لكن ماذا عن الأحجار البعيدة عن المناطق الكثيفة؟ تعال إلى كهفي.',en:'Now you know how we organise stones. But what about those far from any dense region? Come to my cavern.'}])}}
function renderQuiz(){
 const n=g.dbRound,radar=$('radar');

 const p=g.player;

 let ix=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0),iy=(keys.arrowdown||keys.s?1:0)-(keys.arrowup||keys.w?1:0);const l=Math.hypot(ix,iy);if(l){ix/=l;iy/=l}

 const spd=Math.min(1.4,Math.hypot(p.vx,p.vy)/270),oph=p.ph;p.walk+=(Math.min(1,spd*1.15)-p.walk)*Math.min(1,dt*10);if(spd>.08)p.ph+=dt*(5+spd*8);

 // motes
 for(const m of MOTES){let y=(m.y-t*m.v*(g.stage===4?2.2:1))%H;if(y<0)y+=H;ctx.globalAlpha=.2+.5*Math.abs(Math.sin(t*1.5+m.p));ctx.fillStyle=p.mote;ctx.beginPath();ctx.arc(m.x+Math.sin(t*.7+m.p)*26,y,m.s,0,TAU);ctx.fill()}
 ctx.restore()}

function pickAlpha(p){return p.inv>0&&Math.floor(clock*14)%2?.35:1}
function drawHero(c,p){figure(c,{role:'H',fem:gender==='female',x:p.x,y:p.y,s:1,t:clock,walk:p.walk,ph:p.ph,face:p.face,alpha:pickAlpha(p)})}
function npcItem(items,role,x,y,s=1){items.push({y,fn:()=>{figure(ctx,{role,x,y,s,t:clock+x*.01,face:g.player.x<x?-1:1,walk:0,ph:0})}})}
function npcName(role,x,y,s=1){label(ctx,x,y+24,PN[role].short,PN[role].c,11)}

function draw(){
 const p=g.player,t=clock;ctx.setTransform(S,0,0,S,0,0);
 ctx.save();if(shake>0)ctx.translate(rand(-1,1)*shake*14,rand(-1,1)*shake*10);
 const bgc=BG[g.stage]||(BG[g.stage]=paintStage(g.stage));
 ctx.drawImage(bgc,(600-p.x)*.012-12,(400-p.y)*.006-7,W+24,H+14);
 atmosphere(t);
 const items=[],tops=[];
 // ---- stage layers
 if(g.stage===0){
  for(const f of FEATS){if(g.collected.has(f.id))continue;const k=.5+.5*Math.sin(t*3+f.x);ell(ctx,f.x,f.y,30+k*6,12+k*2,rg(f.col,.12),rg(f.col,.5+k*.4),1.8)}
  npcItem(items,'K',1010,430);npcItem(items,'D',405,340);npcItem(items,'P',800,360);
  for(const f of FEATS){if(g.collected.has(f.id))continue;items.push({y:f.y,fn:()=>gem(ctx,f.x,f.y-38+Math.sin(t*2.4+f.x)*6,17,f.col,t,f.x*.01)});tops.push(()=>label(ctx,f.x,f.y+20,T({ar:f.ar,en:f.en}),f.col,12))}
  items.push({y:445,fn:()=>drawPortal(ctx,GATE[0].x,GATE[0].y,g.ready,'#f8dca0',t)});
  tops.push(()=>{npcName('K',1010,430);npcName('D',405,340);npcName('P',800,360)})}
 if(g.stage===1){
  const hl=g.holding;[[215,'#34d1b6'],[985,'#f2b24c']].forEach(([x,col])=>{const k=.5+.5*Math.sin(t*3);ell(ctx,x,400,62,22,rg(col,hl?.16+k*.1:.07),rg(col,hl?.9:.45),2);
   const cy=340+Math.sin(t*2+x)*4;ln(ctx,x-14,cy,x+14,cy,col,2.5);ln(ctx,x,cy-14,x,cy+14,col,2.5);ell(ctx,x,cy,9,9,null,col,2)});
  tops.push(()=>{label(ctx,215,330,L('صغيرة','Small'),'#34d1b6',13);label(ctx,985,330,L('كبيرة','Large'),'#f2b24c',13)});
  npcItem(items,'K',600,335,.92);tops.push(()=>npcName('K',600,335));
  if(!g.holding&&!g.questComplete)items.push({y:440,fn:()=>{glow(ctx,600,440,90,'#f8dca0',.35);gem(ctx,600,402+Math.sin(t*4)*6,22,'#ffe9b8',t,0)}});
  if(g.questComplete)items.push({y:505,fn:()=>drawPortal(ctx,GATE[1].x,GATE[1].y,true,'#a58bff',t)})}
 if(g.stage===2){
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const q of DP){const dx=(q.x-p.x)/84,dy=(q.y-p.y)/38,inn=dx*dx+dy*dy<1,flick=.65+.35*Math.sin(t*2+q.x);
   if(inn&&g.started){ln(ctx,p.x,p.y-8,q.x,q.y,'rgba(125,255,230,.12)',1)}
   ctx.fillStyle=q.noise?(inn?'#ff9ab0':'rgba(255,100,140,.65)'):(inn?'#d8fff6':`rgba(100,240,215,${.45*flick})`);ctx.beginPath();ctx.arc(q.x,q.y,inn?3.1:2.1,0,TAU);ctx.fill()}
  ctx.restore();
  BEACONS.forEach((bc,i)=>{if(i<g.dbRound){ell(ctx,bc.x,bc.y,24,9,'rgba(125,255,230,.1)','rgba(125,255,230,.6)',1.6);return}
   const cur=i===g.dbRound&&!g.questComplete;ell(ctx,bc.x,bc.y,34,13,rg('#34d1b6',cur?.2:.06),rg('#7dffe6',cur?.9:.3),1.8);
   items.push({y:bc.y,fn:()=>{ctx.globalAlpha=cur?1:.4;gem(ctx,bc.x,bc.y-38+Math.sin(t*3+i)*5,18,'#7dffe6',t,i);ctx.globalAlpha=1}});if(cur)tops.push(()=>label(ctx,bc.x,bc.y+22,L('فحص ','Scan ')+(i+1),'#7dffe6',12))});
  npcItem(items,'D',1075,310);tops.push(()=>npcName('D',1075,310));
  if(g.questComplete)items.push({y:505,fn:()=>drawPortal(ctx,GATE[2].x,GATE[2].y,true,'#7dffe6',t)})}
 if(g.stage===3){
  PEDS.forEach(pd=>{const sel=g.pcaPicked===pd.n,pct=DATA.meta.pcaByN[pd.n],hh=pct*.78,col=pd.n===2?'#f8dca0':'#a58bff',nr=dist(p,pd)<75&&!g.questComplete;
   items.push({y:pd.y,fn:()=>{
    glow(ctx,pd.x,pd.y-hh/2,110,col,sel||nr?.4:.2);ell(ctx,pd.x,pd.y+34,68,15,'rgba(0,0,0,.5)');
    rr(ctx,pd.x-54,pd.y+4,108,34,10,'#1a1452',rg(col,.85),1.8);ell(ctx,pd.x,pd.y+4,54,12,'#2a2090',rg(col,.95),2);
    const bar=ctx.createLinearGradient(0,pd.y-hh,0,pd.y);bar.addColorStop(0,rg(col,.95));bar.addColorStop(1,rg(col,.2));ctx.fillStyle=bar;ctx.fillRect(pd.x-16,pd.y-hh,32,hh);ctx.strokeStyle=rg('#ffffff',.7);ctx.lineWidth=1.3;ctx.strokeRect(pd.x-16,pd.y-hh,32,hh);
    const th=pd.y-85*.78;ctx.setLineDash([4,3]);ln(ctx,pd.x-30,th,pd.x+30,th,'#ff7ac6',1.6);ctx.setLineDash([]);
    gem(ctx,pd.x,pd.y-hh-16+Math.sin(t*2+pd.x)*3,9,col,t,pd.n,false);
    txt(ctx,pd.n+' PCs',pd.x,pd.y+22,15,'#fff',900,'center','ltr')}});
   tops.push(()=>{txt(ctx,pct.toFixed(2)+'%',pd.x,pd.y-hh-40,13,'#f4efff',800)})});
  tops.push(()=>{const x=600,y=222;rr(ctx,x-250,y-17,500,34,17,'rgba(7,10,22,.84)',rg('#ff7ac6',.8),1.4);txt(ctx,L('الهدف: حفظ 85% من التباين بأقل عدد من المكوّنات (الخط الوردي)','Goal: keep 85% of the variance with the fewest components (pink line)'),x,y+1,13,'#fff',700)});
  npcItem(items,'P',1100,345);tops.push(()=>npcName('P',1100,345));
  if(g.questComplete)items.push({y:505,fn:()=>drawPortal(ctx,GATE[3].x,GATE[3].y,true,'#a58bff',t)})}
 if(g.stage===4){
  items.push({y:440,fn:()=>bossFig(ctx,985,445,t,g.bossHP,hitT,g.shotTimer<.4)});
  tops.push(()=>{for(const q of projectiles){glow(ctx,q.x,q.y,30,'#ff4d6d',.6);gem(ctx,q.x,q.y,q.r*.8,'#ff6b88',t*2,q.x*.01,false)}
   const k=g.bossOrder[g.bossStep];if(k&&!g.dialog){const c=PN[k].c,x=600,y=118;rr(ctx,x-290,y-34,580,70,16,'rgba(8,6,18,.88)',rg(c,.85),1.6);
    txt(ctx,L('الملك يطالب','THE KING DEMANDS'),x,y-16,11,c,900);txt(ctx,T(BPROMPT[k]),x,y+8,20,'#fff',900);
    for(let i=0;i<3;i++)ell(ctx,x-24+i*24,y+27,5,5,i<g.bossStep?PN[g.bossOrder[i]].c:'rgba(255,255,255,.18)',null)}})}
 // hazards
 for(const h of g.haz)items.push({y:h.y,fn:()=>drawSentinel(ctx,h,t)});
 // followers + hero
 ['K','D','P'].filter(a=>g.allies[a]).forEach((a,i)=>{const f=fol[i];if(f)items.push({y:f.y,fn:()=>figure(ctx,{role:a,x:f.x,y:f.y,s:.62,t:t+i,face:f.f,walk:f.w,ph:f.ph||0})})});
 for(const q of ghosts)items.push({y:q.y-1,fn:()=>figure(ctx,{role:'H',fem:gender==='female',x:q.x,y:q.y,s:1,t,walk:1,ph:q.ph,face:q.f,alpha:q.t*.3})});
 items.push({y:p.y,fn:()=>{drawHero(ctx,p);if(g.holding&&g.stage===1){gem(ctx,p.x,p.y-132+Math.sin(t*4)*3,13,'#ffe9b8',t,0)}}});
 items.sort((a,b)=>a.y-b.y);items.forEach(i=>i.fn());
 tops.forEach(f=>f());
 // stage 2 neighbour readout
 if(g.stage===2&&g.started&&!g.dialog&&!g.quiz){const n=g.neigh,core=n>=10,col=core?'#7dffe6':'#ff9ab0';ell(ctx,p.x,p.y,84,38,rg(col,.06),rg(col,.75),1.8);
  label(ctx,p.x,p.y+46,L(`جيران داخل الحلقة: ${n} · ${core?'Core':'أقل من 10'}`,`Neighbours in ring: ${n} · ${core?'Core':'< 10'}`),col,11)}
 // carried diamond card
 if(g.stage===1&&g.holding){const d=g.holding,s=L(`قيراط ${d.carat.toFixed(2)} | X ${d.x.toFixed(2)} | Y ${d.y.toFixed(2)} | عمق ${d.depth.toFixed(1)}%`,`${d.carat.toFixed(2)} ct | X ${d.x.toFixed(2)} | Y ${d.y.toFixed(2)} | depth ${d.depth.toFixed(1)}%`),cx=clamp(p.x,160,1040),cy=p.y-170;
  rr(ctx,cx-155,cy-17,310,34,10,'rgba(7,10,22,.9)',rg('#f8dca0',.8),1.4);txt(ctx,s,cx,cy+1,12.5,'#f8dca0',800)}
 // dash cooldown arc
 if(g.started&&g.player.cd>0){const k=1-g.player.cd/.9;ctx.strokeStyle='rgba(248,220,160,.8)';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(p.x,p.y+14,16,0,TAU*k);ctx.stroke()}
 // interact prompt
 if(g.started&&!g.dialog&&!g.quiz&&!g.evidenceOpen&&nearSpot())keycap(ctx,p.x,p.y-122,t,'E');
 // particles / rings / pops
 ctx.save();ctx.globalCompositeOperation='lighter';for(const q of particles){ctx.globalAlpha=clamp(q.life/q.ttl,0,1);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,q.size,0,TAU);ctx.fill()}ctx.restore();ctx.globalAlpha=1;
 for(const r of rings){const k=r.t/.65;ctx.globalAlpha=Math.max(0,1-k);ell(ctx,r.x,r.y,14+k*120,(14+k*120)*.42,null,r.c,4*(1-k)+.5)}ctx.globalAlpha=1;
 for(const q of pops){ctx.globalAlpha=Math.max(0,1-q.t/1.2);txt(ctx,q.s,q.x,q.y-q.t*50,22,'#f8dca0',900)}ctx.globalAlpha=1;
 if(flash>0){ctx.fillStyle=`rgba(255,93,122,${flash*.3})`;ctx.fillRect(-20,-20,W+40,H+40)}
 ctx.restore();
 if(fade>0){ctx.fillStyle=`rgba(6,8,15,${Math.min(1,fade)})`;ctx.fillRect(0,0,W,H)}}

function frame(now){
 const dt=Math.min(.045,Math.max(.001,(now-last)/1000));last=now;
 update(dt);flash=Math.max(0,flash-dt);
 for(const q of particles){q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;q.vy+=50*dt}particles=particles.filter(q=>q.life>0);
 const d=g.dialog;if(d&&d.typing){d.n+=dt*(LANG==='ar'?70:90);if(d.n>=d.full.length){d.n=d.full.length;d.typing=false}$('dLine').textContent=d.full.slice(0,Math.floor(d.n))}
 draw();requestAnimationFrame(frame)}

/* ============ input ============ */
const GAMEKEYS=['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d','e','enter',' ','1','2','3'];
function onKey(e,down){
 const k=e.key.toLowerCase();if(!g)return;
 if(!down){keys[k]=false;return}
 const overlayOpen=!$('startOverlay').classList.contains('hidden');
 if(GAMEKEYS.includes(k)&&g.started&&!overlayOpen&&e.target.tagName!=='INPUT')e.preventDefault();
 if(e.repeat&&!['w','a','s','d','arrowleft','arrowright','arrowup','arrowdown'].includes(k))return;
 keys[k]=true;
 if(g.evidenceOpen||!g.started)return;
 if(g.dialog){if(['enter','e',' '].includes(k))nextDialogue();return}
 if(g.quiz)return;if(g.completed)return;
 if(k==='e'||k==='enter')interact();
 if(k===' ')dash();
 if(g.stage===4){if(k==='1')bossAttack('K');if(k==='2')bossAttack('D');if(k==='3')bossAttack('P')}}
addEventListener('keydown',e=>onKey(e,true));addEventListener('keyup',e=>onKey(e,false));
addEventListener('blur',()=>{keys={}});

/* ============ language + wiring ============ */
function applyLang(){
 document.documentElement.lang=LANG;document.documentElement.dir=LANG==='ar'?'rtl':'ltr';
 document.querySelectorAll('[data-ar]').forEach(e=>{const v=LANG==='ar'?e.dataset.ar:e.dataset.en;if(e.hasAttribute('data-h'))e.innerHTML=v;else e.textContent=v});
 $('langAr').setAttribute('aria-pressed',String(LANG==='ar'));$('langEn').setAttribute('aria-pressed',String(LANG==='en'));
 refreshAudioUI();
 if(g){setStartText();updateUI();if(g.dialog)showDialog(true);if(g.quiz)renderQuiz();if(g.evidenceOpen)renderEDA();if(!$('endOverlay').classList.contains('hidden'))renderEnd()}}
function setLang(l){LANG=l;try{localStorage.setItem('cc_lang',l)}catch(e){}applyLang()}
$('langAr').onclick=e=>{setLang('ar');e.currentTarget.blur()};$('langEn').onclick=e=>{setLang('en');e.currentTarget.blur()};
$('chooseHe').onclick=e=>{chooseGender('male');e.currentTarget.blur()};$('chooseShe').onclick=e=>{chooseGender('female');e.currentTarget.blur()};
$('startBtn').onclick=e=>{e.currentTarget.blur();startGame()};
$('dNext').onclick=e=>{e.currentTarget.blur();nextDialogue()};$('skipBtn').onclick=e=>{e.currentTarget.blur();nextDialogue(true)};
$('dialogue').addEventListener('click',e=>{if(e.target.closest('button'))return;nextDialogue()});
$('qA').onclick=()=>answerDensity(g.dbRound===2?'eps03':'core');$('qB').onclick=()=>answerDensity(g.dbRound===2?'eps05':'noise');
$('closeEvidence').onclick=e=>{e.currentTarget.blur();closeEvidence()};$('evidenceBtn').onclick=e=>{e.currentTarget.blur();showEvidence()};
$('playAgain').onclick=e=>{e.currentTarget.blur();reset()};$('resetBtn').onclick=e=>{e.currentTarget.blur();reset()};
$('musicBtn').onclick=e=>{e.currentTarget.blur();musicOn=!musicOn;refreshAudioUI();if(musicOn&&g.started)startAmbience();else stopAmbience()};
$('fullBtn').onclick=e=>{e.currentTarget.blur();const el=document.querySelector('.stagecol');if(document.fullscreenElement)document.exitFullscreen();else if(el.requestFullscreen)el.requestFullscreen().catch(()=>{})};
document.querySelectorAll('.skill').forEach(b=>b.onclick=e=>{e.currentTarget.blur();if(g.stage===4)bossAttack(b.dataset.skill)});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopAmbience();else if(musicOn&&g&&g.started)startAmbience()});
// touch controls
const TMAP={up:'w',down:'s',left:'a',right:'d'};
document.querySelectorAll('.dpad button').forEach(bt=>{const k=TMAP[bt.dataset.dir];bt.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>bt.addEventListener(ev,()=>{keys[k]=false}))});
$('tDash').addEventListener('pointerdown',e=>{e.preventDefault();if(g.started&&!g.dialog)dash()});$('tAct').addEventListener('pointerdown',e=>{e.preventDefault();if(g.dialog)nextDialogue();else interact()});

// portraits
drawPortrait($('pvHe'),'H',false);drawPortrait($('pvShe'),'H',true);
['K','D','P'].forEach(r=>{drawPortrait($('pv'+r),r,false);drawPortrait($('cv'+r),r,false)});
reset();applyLang();requestAnimationFrame(frame);
